<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Teak &amp; Sun - Action RPG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Pixelify+Sans:wght@600&display=swap">
<style>
:root{--bg:#1c2130;--panel:#262d40;--ink:#f3e8cf;--mute:#9aa3ba;--gold:#e3b04b;--teak:#79a64f;--sun:#ee7a3c;--err:#ff7b6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Kanit,"Noto Sans Thai",sans-serif;font-size:16px;line-height:1.5}
.pix{font-family:"Pixelify Sans",Kanit,monospace;letter-spacing:.02em}
main{max-width:520px;margin:0 auto;padding:20px 16px 32px}
.screen{display:none}.screen.on{display:block}
h1{font-size:26px;margin:0 0 4px;color:var(--gold)}
p.sub{margin:0 0 20px;color:var(--mute)}
input{width:100%;font:inherit;font-size:20px;padding:14px;border:2px solid #44506e;background:var(--panel);color:var(--ink);border-radius:4px}
input:focus-visible,button:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:var(--err);min-height:24px;margin:6px 0 0;font-size:14px}
.row{display:flex;gap:10px;margin-top:14px}
button{font:inherit;font-weight:600;border:2px solid var(--gold);background:var(--gold);color:#241c08;padding:12px 18px;border-radius:4px;cursor:pointer;flex:1}
button.ghost{background:transparent;color:var(--gold)}
button:disabled{opacity:.4;cursor:not-allowed}
.cards{display:grid;gap:12px}
.card{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;background:var(--panel);border:3px solid #44506e;border-radius:6px;padding:10px;cursor:pointer;text-align:left;color:inherit}
.card img{width:110px;height:130px;object-fit:contain;image-rendering:pixelated}
.card[data-o=teak].sel{border-color:var(--teak);box-shadow:0 0 0 3px #79a64f55}
.card[data-o=sun].sel{border-color:var(--sun);box-shadow:0 0 0 3px #ee7a3c55}
.card h2{margin:0;font-size:22px}
.card .tag{margin:0 0 8px;color:var(--mute);font-size:14px}
.bar{display:grid;grid-template-columns:44px 1fr 34px;gap:6px;align-items:center;font-size:13px;margin:3px 0}
.bar i{display:block;height:8px;background:#11151f;border-radius:2px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--gold)}
.card[data-o=teak] .bar b{background:var(--teak)}.card[data-o=sun] .bar b{background:var(--sun)}
.bar span:last-child{text-align:right}
.sheet{background:var(--panel);border:3px solid var(--gold);border-radius:6px;padding:16px;text-align:center}
.sheet img{height:190px;image-rendering:pixelated}
.sheet h2{margin:6px 0 0;font-size:28px}
.sheet .meta{color:var(--mute);margin:0 0 12px}
.sheet .bar{text-align:left}
.free{margin-top:12px;padding:8px;border:2px dashed var(--gold);color:var(--gold);border-radius:4px}
.toast{margin-top:12px;color:var(--teak);min-height:24px;text-align:center}

body.play{overflow:hidden;touch-action:none;height:100%;-webkit-user-select:none;user-select:none}
body.play main{display:none}
#game{display:none;position:fixed;inset:0}
body.play #game{display:block}
#game canvas{display:block;width:100%;height:100%}
#zone{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:5;pointer-events:none;opacity:0;transition:opacity .7s;text-align:center;color:#f3e8cf;text-shadow:0 2px 0 #1c2130,0 0 12px #000a;font-family:Kanit,sans-serif}#zone b{display:block;font-size:34px;letter-spacing:2px;color:#e3b04b}#zone span{font-size:16px}
#mapw{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:108px;height:108px;border:2px solid var(--gold);border-radius:6px;background:#1c2130cc;overflow:hidden;pointer-events:auto;cursor:pointer;z-index:3;transition:width .18s,height .18s}
#mapw.big{width:min(86vw,420px,calc(100vh - 40px));height:min(86vw,420px,calc(100vh - 40px))}
#mm{display:block;width:100%;height:100%}
#stat{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);width:min(190px,48vw);background:#1c2130cc;border:2px solid var(--gold);border-radius:6px;padding:6px 10px;pointer-events:none}
#stat .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
#stat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stat .lv{color:var(--gold);font-weight:600;flex:none}
#hpbar{height:12px;background:#11151f;border-radius:3px;overflow:hidden;margin-top:4px}
#hpfill{height:100%;width:100%;background:#d9534f}
#hptx,#xptx{font-size:12px;color:var(--mute);text-align:right}
#xpbar{height:6px;background:#11151f;border-radius:3px;overflow:hidden;margin-top:3px}
#xpfill{height:100%;width:0;background:#7fd0ff}
#exit{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 114px);flex:none;padding:4px 12px;font-size:14px}
#atk{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:120px;height:120px;flex:none;padding:0;border:0;background:none;border-radius:50%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#atk img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px #000a);transition:transform .08s,filter .15s}
#atk:active img{transform:scale(.9)}
#atk.cd img{filter:grayscale(.85) brightness(.6)}
#ted{position:fixed;right:146px;bottom:calc(env(safe-area-inset-bottom,0px) + 32px);width:72px;height:72px;display:none;flex:none;padding:0;border:3px solid var(--gold);border-radius:50%;background:#1c2130cc;touch-action:manipulation}
#ted.on{display:block}
#ted img{width:70%;height:70%;object-fit:contain;image-rendering:pixelated}
#ted.cd{filter:grayscale(.85) brightness(.6)}
#shop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:6}
#shop.on{display:flex}
#shop .box{background:var(--panel);border:3px solid var(--gold);border-radius:6px;padding:16px;width:min(360px,92vw);text-align:center;max-height:90vh;overflow:auto}
#shop h2{margin:0;color:var(--gold)}
.si{display:flex;align-items:center;gap:10px;background:#11151f;border:2px solid #44506e;border-radius:4px;padding:6px 8px;margin:6px 0;text-align:left}
.si img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated;flex:none}
.si div{flex:1;font-size:13px;line-height:1.4}
.si b{color:var(--gold)}
.si button{padding:4px 10px;font-size:13px;flex:none}
#buff{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);color:#ffd24a;font-weight:600;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none}
#inv .box{max-height:90vh;overflow:auto}
#bag{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 126px);width:64px;height:64px;flex:none;padding:0;border:0;background:none}
#bag img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 6px #000a)}
#inv{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:5}
#inv.on{display:flex}
#inv .box{background:var(--panel);border:3px solid var(--gold);border-radius:6px;padding:16px;width:min(340px,90vw);text-align:center}
#inv h2{margin:0;color:var(--gold)}
#slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
#quest{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 148px);width:min(190px,48vw);pointer-events:none;font-size:13px;line-height:1.4;text-align:right}
#quest.open{background:#1c2130cc;border:2px solid var(--gold);border-radius:6px;padding:6px 10px;text-align:left}
#qtog{pointer-events:auto;flex:none;padding:3px 10px;font-size:13px;background:#1c2130cc;display:inline-block}
#quest.open #qtog{display:block;margin:0 0 4px auto}
#qbody{display:none}
#quest.open #qbody{display:block}
#quest b{color:var(--gold);font-weight:600}
#quest i{display:block;height:6px;background:#11151f;border-radius:3px;overflow:hidden;margin:4px 0}
#quest u{display:block;height:100%;width:0;background:var(--teak);text-decoration:none}
#quest .gm{color:#7fd0ff}
.slot img{width:36px;height:32px;object-fit:contain;image-rendering:pixelated}
.slot{aspect-ratio:1;background:#11151f;border:2px solid #44506e;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px}
#talk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);flex:none;display:none;background:#262d40ee;padding:12px 18px;z-index:4}
#adm{position:fixed;right:76px;top:calc(env(safe-area-inset-top,0px) + 114px);flex:none;padding:4px 10px;font-size:14px;display:none}
body.play #adm{display:block}
#admp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000b;z-index:7}
#admp.on{display:flex}
#admp .box{background:var(--panel);border:3px solid var(--gold);border-radius:6px;padding:16px;width:min(320px,90vw);text-align:center}
#admp h2{margin:0 0 8px;color:var(--gold)}
#admp input[type=number]{width:90px;font-size:20px;text-align:center}
#admp input[type=range]{width:100%;margin:10px 0}
#admp .row{display:flex;gap:8px;justify-content:center;margin-top:8px}
#drop{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);display:none;align-items:center;gap:10px;background:#262d40ee;border:3px solid var(--gold);border-radius:6px;padding:8px 16px;z-index:4;pointer-events:none;font-size:16px;max-width:90vw}
#drop.on{display:flex}
#drop img{width:56px;height:48px;object-fit:contain;image-rendering:pixelated}
#dlg{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;z-index:6;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
#dlg.on{display:flex}
#dlg .box{display:grid;grid-template-columns:96px 1fr;gap:12px;width:min(560px,100%);background:var(--panel);border:3px solid var(--gold);border-radius:6px;padding:12px}
#dimg{width:96px;height:auto;align-self:end;image-rendering:pixelated}
#dlg h3{margin:0 0 4px;color:var(--gold);font-size:20px}
#dlgtx{min-height:84px;margin:0;font-size:16px;cursor:pointer}
#dlg .btns{display:flex;gap:8px;margin-top:8px}
#dlg .btns:empty{display:none}
</style>
</head>
<body>
<main>
<section class="screen on" id="s1">
  <h1 class="pix">ตั้งชื่อวีรบุรุษ</h1>
  <p class="sub">ชื่อนี้จะถูกเรียกขานไปทั่วดินแดน</p>
  <label for="nm" class="sub" style="display:block;margin-bottom:6px">ชื่อตัวละคร (2–12 ตัวอักษร)</label>
  <input id="nm" maxlength="12" autocomplete="off" placeholder="ชื่อวีรบุรุษของคุณ...">
  <p class="err" id="e1" role="alert"></p>
  <div class="row"><button class="ghost" id="rnd">สุ่มชื่อ</button><button id="n1" disabled>ถัดไป</button></div>
</section>

<section class="screen" id="s2">
  <h1 class="pix">เลือกสายเริ่มต้น</h1>
  <p class="sub" id="hi"></p>
  <div class="cards" id="cards"></div>
  <div class="row"><button class="ghost" id="b2">กลับ</button><button id="n2" disabled>ยืนยัน</button></div>
</section>

<section class="screen" id="s3">
  <h1 class="pix">ตัวละครของคุณ</h1>
  <div class="sheet" id="sheet"></div>
  <div class="row"><button class="ghost" id="b3">แก้ไข</button><button id="go">เริ่มผจญภัย</button></div>
  <p class="toast" id="toast" role="status"></p>
</section>
</main>
<div id="game"><canvas id="c"></canvas><div id="zone"></div><div id="mapw"><canvas id="mm" width="216" height="216"></canvas></div>
<div id="stat"><div class="top"><span class="nm" id="snm"></span><span class="lv" id="slv"></span></div><div id="hpbar"><div id="hpfill"></div></div><div id="hptx"></div><div id="xpbar"><div id="xpfill"></div></div><div id="xptx"></div></div>
<div id="quest"><button id="qtog" class="ghost"></button><div id="qbody"></div></div>
<button id="talk" class="ghost">💬 คุยกับลุงอ๊อด (E)</button>
<div id="drop"><img alt=""><span></span></div>
<div id="dlg"><div class="box"><img id="dimg" alt=""><div><h3 class="pix" id="dname">ลุงอ๊อด</h3><p id="dlgtx"></p><div id="dch" class="btns"></div><div class="btns"><button id="dskip" class="ghost">ข้าม</button><button id="dnext">ถัดไป ▶</button></div></div></div></div>
<button id="bag" aria-label="กระเป๋า"><img alt="" src="img_001.png"></button>
<div id="shop"><div class="box"><h2 class="pix" id="shopt">ร้านลุงอ๊อด</h2><p id="shopg"></p><div id="shopl"></div><button id="shopx">ปิด</button></div></div>
<div id="inv"><div class="box"><h2 class="pix">กระเป๋า</h2><p id="gold"></p><div id="slots"></div><button id="invx">ปิด</button></div></div>
<button id="exit" class="ghost">ออก</button>
<button id="adm" class="ghost" aria-label="Admin">⚙ Admin</button>
<div id="admp"><div class="box"><h2 class="pix">Admin Panel</h2><p id="admcur"></p><label>เลเวล (1–100)</label><br><input id="admn" type="number" min="1" max="100" value="1"><input id="admr" type="range" min="1" max="100" value="1"><div class="row"><button id="admset">ตั้งเลเวล</button><button id="admx" class="ghost">ปิด</button></div></div></div>
<div id="buff"></div>
<button id="ted" aria-label="ตุ๊กตาหมี (H)"><img alt="" src=""></button>
<button id="atk" aria-label="โจมตี"><img alt="" src="img_002.png"></button></div>
<script>
/* ===== DATA / SCENES / SYSTEMS / RENDER ===== */

const ORIGINS={
  teak:{label:"Teak",tag:"อึด ถึก ทน",
    base:{maxHp:150,moveSpeed:160,attack:10,defense:8}},
  sun:{label:"Sun",tag:"ไว คล่อง ว่องไว",
    base:{maxHp:90,moveSpeed:220,attack:12,defense:3}}
};
const CAP={maxHp:200,moveSpeed:260,attack:20,defense:15};
const LBL={maxHp:"HP",moveSpeed:"Speed",attack:"Atk",defense:"Def"};
const FREE_POINTS=5;
const NAMES=["Kaiden","Ryo","Arin","Nova","Kiba","Thorn","Sora","Zeph","Lumi","Rex"];
const $=id=>document.getElementById(id);
let name="",origin=null;

function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));window.scrollTo(0,0)}
function clean(v){return v.replace(/[<>&"'`]/g,"").replace(/\s+/g," ").trim()}
function validate(){
  const v=clean($("nm").value),n=[...v].length;
  let msg="";
  if($("nm").value&&n<2)msg="ชื่อต้องมีอย่างน้อย 2 ตัวอักษร";
  $("e1").textContent=msg;
  $("n1").disabled=!(n>=2&&n<=12);
  return v;
}
function bars(base){
  return Object.keys(LBL).map(k=>`<div class="bar"><span>${LBL[k]}</span><i><b style="width:${Math.round(base[k]/CAP[k]*100)}%"></b></i><span>${base[k]}</span></div>`).join("");
}
function buildCards(){
  $("cards").innerHTML=Object.entries(ORIGINS).map(([k,o])=>
    `<button type="button" class="card" data-o="${k}" aria-pressed="false"><img src="${ASSETS.portrait[k]}" alt="ตัวละครสาย ${o.label}"><div><h2 class="pix">${o.label}</h2><p class="tag">${o.tag}</p>${bars(o.base)}</div></button>`).join("");
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{
    origin=c.dataset.o;
    document.querySelectorAll(".card").forEach(x=>{const on=x===c;x.classList.toggle("sel",on);x.setAttribute("aria-pressed",on)});
    $("n2").disabled=false;
  });
}
function makeCharacter(){
  const o=ORIGINS[origin];
  return{id:"char_"+Date.now(),name,origin,level:1,exp:0,class:"unclassed",
    baseStats:{...o.base},freeStatPoints:FREE_POINTS,
    allocatedPoints:{hp:0,speed:0,attack:0,defense:0}};
}
function renderSheet(){
  const c=makeCharacter(),o=ORIGINS[origin];
  $("sheet").innerHTML=`<img src="${ASSETS.portrait[origin]}" alt=""><h2 class="pix"></h2><p class="meta">Lv.${c.level} · Unclassed · ${o.label}</p>${bars(c.baseStats)}<div class="free">แต้มอิสระ ${c.freeStatPoints} แต้ม (ใช้แจกได้ใน Step ถัดไป)</div>`;
  $("sheet").querySelector("h2").textContent=name;
}

$("nm").oninput=validate;
$("nm").onkeydown=e=>{if(e.key==="Enter"&&!$("n1").disabled)$("n1").click()};
$("rnd").onclick=()=>{$("nm").value=NAMES[Math.floor(Math.random()*NAMES.length)];validate()};
$("n1").onclick=()=>{name=validate();$("hi").textContent="สวัสดี "+name+" เลือกสไตล์การเล่นของคุณ";$("hi").textContent=$("hi").textContent;show("s2")};
$("b2").onclick=()=>show("s1");
$("n2").onclick=()=>{renderSheet();show("s3")};
$("b3").onclick=()=>show("s2");
$("go").onclick=()=>{
  const c=makeCharacter();
  try{localStorage.setItem("rpg_character",JSON.stringify(c))}catch(e){}
  startGame(c)};
$("exit").onclick=exitGame;
function init(){buildCards();loadArt();requestAnimationFrame(loop)}


/* ===== AUDIO ===== */
const GAME_AUDIO={
  sfx:{
    slash:"https://opengameart.org/sites/default/files/hit.wav",
    woodHit:"https://opengameart.org/sites/default/files/groundhit.wav",
    waterFill:"https://opengameart.org/sites/default/files/water.wav",
    berryPick:"https://opengameart.org/sites/default/files/Dripping%20Water.wav",
    slimeAcid:"https://opengameart.org/sites/default/files/swamp.ogg"
  },
  bgm:{
    forestTheme:"https://opengameart.org/sites/default/files/bgm_action_1.mp3",
    battleTheme:"https://opengameart.org/sites/default/files/bgm_action_2.mp3",
    hubTheme:"https://opengameart.org/sites/default/files/Kings_Feast.mp3"
  }
};
const SFX_VOL=.6,BGM_VOL=.35,sfxA={},sfxT={},bgmA={};
for(const k in GAME_AUDIO.sfx){sfxA[k]=new Audio(GAME_AUDIO.sfx[k]);sfxA[k].preload="auto"}
for(const k in GAME_AUDIO.bgm){const a=new Audio(GAME_AUDIO.bgm[k]);a.loop=true;a.volume=BGM_VOL;a.preload="auto";bgmA[k]=a}
function sfx(k,x,y){ // x,y = เสียงเกิดที่ไหน (ไม่ใส่ = ดังเต็ม), ไกลเกิน 400px ไม่ดัง
  const a=sfxA[k],n=performance.now();if(!a||n-(sfxT[k]||0)<80)return;
  let v=SFX_VOL;if(x!==undefined){const d=Math.hypot(x-px,y-py);if(d>400)return;v*=1-d/500}
  sfxT[k]=n;const c=a.cloneNode();c.volume=Math.max(0,Math.min(1,v));c.play().catch(()=>{})}
let bgmCur=null,battleUntil=0;
function bgmWant(){
  if(inVil(px,py))return"hubTheme";
  const n=performance.now();
  if(en.some(e=>e.hp>0&&Math.hypot(e.x-px,e.y-py)<260))battleUntil=n+3000;
  return n<battleUntil?"battleTheme":"forestTheme"}
function bgmTick(){
  if(!running||paused){return}
  const w=bgmWant();
  if(w!==bgmCur){if(bgmCur)bgmA[bgmCur].pause();bgmCur=w;bgmA[w].currentTime=0}
  if(bgmA[w].paused)bgmA[w].play().catch(()=>{})}
function bgmStop(){if(bgmCur)bgmA[bgmCur].pause();bgmCur=null}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&bgmCur)bgmA[bgmCur].pause()});
addEventListener("pointerdown",()=>{ // ปลดล็อกเสียงบนมือถือ (ครั้งแรกที่แตะ)
  for(const k in bgmA){const a=bgmA[k];a.muted=true;a.play().then(()=>{a.pause();a.muted=false}).catch(()=>{a.muted=false})}},{once:true});
const T=48,W=48,H=48,SC=1.5,SZ=64*SC; // tile, map size in tiles, sprite scale
const cv=document.getElementById("c"),g=cv.getContext("2d");
let ch=null,sprite=null,px=W*T/2,py=H*T/2,face="right",walk=0,idle=0,vw=0,vh=0;
let atkT=0,cdT=0;const ATK=.4,CD=.55,OW=120,OH=110;let atkImg=null,hitDone=true,paused=false,gel=0,gold=0;const en=[],fl=[];
function attack(){if(!running||paused||cdT>0)return;hitDone=false;atkT=ATK;cdT=CD;$("atk").classList.add("cd")}

  if(t.sh>0)t.sh=Math.max(0,t.sh-dt);
  if(t.hp>0)continue;
  t.rs-=dt;
  if(t.rs<=0){ // wait if someone is standing on the trunk
    if(trunkHit(t,px,py)||en.some(e=>e.hp>0&&trunkHit(t,e.x,e.y)))t.rs=1;else t.hp=TREE_HP}}}

function blocked(x,y){ // feet box 20x12 around (x,y)

  if(trees.some(t=>t.hp>0&&trunkHit(t,x,y)))return true;
  if(NPCS.some(n=>trunkHit(n,x,y)))return true;
  if(VIL_RECTS.some(r=>x+10>r[0]&&x-10<r[2]&&y>r[1]&&y-12<r[3]))return true;
  return false}

function input(){
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(joy.on){let jx=joy.x-joy.ox,jy=joy.y-joy.oy;const m=Math.hypot(jx,jy);
    if(m>8){const k=Math.min(m,50)/50;dx=jx/m*k;dy=jy/m*k}}
  const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}
  return[dx,dy]}

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(running&&ch){
    if(paused){requestAnimationFrame(loop);return}
    atkT=Math.max(0,atkT-dt);if(atkT>0&&!hitDone&&atkT<ATK*.6){hitDone=true;resolveHit()}
    ch.inv=Math.max(0,ch.inv-dt);updateEn(dt);updateAcid(dt);updateTrees(dt);updateBushes(dt);updateTed(dt);updateBuff(dt);updateTalk();for(let i=fl.length;i--;){fl[i].t-=dt;if(fl[i].t<=0)fl.splice(i,1)}
    if(cdT>0){cdT=Math.max(0,cdT-dt);if(!cdT)$("atk").classList.remove("cd")}
    const[dx,dy]=input(),sp=ch.speed;
    if(dx||dy){
      const nx=px+dx*sp*dt,ny=py+dy*sp*dt;
      if(!blocked(nx,py))px=nx;if(!blocked(px,ny))py=ny;
      if(Math.abs(dy)>Math.abs(dx)+.05)face=dy>0?"down":"up";else if(Math.abs(dx)>.15)face=dx>0?"right":"left";
      walk+=dt*sp/16;idle=0}else{walk=0;idle+=dt*4}
    draw()}
  requestAnimationFrame(loop)}

function draw(){
  const cx=Math.round(Math.min(Math.max(px,vw/2),W*T-vw/2)),cy=Math.round(Math.min(Math.max(py,vh/2),H*T-vh/2));
  const ox=Math.round(vw/2-cx),oy=Math.round(vh/2-cy);
  g.fillStyle="#2f5a35";g.fillRect(0,0,vw,vh);
  const x0=Math.max(0,Math.floor(-ox/T)),x1=Math.min(W,Math.ceil((vw-ox)/T)),y0=Math.max(0,Math.floor(-oy/T)),y1=Math.min(H,Math.ceil((vh-oy)/T));
  const tilesOk=ART.tile.length&&ART.tile.every(ok);
  for(let ty=y0;ty<y1;ty++)for(let tx=x0;tx<x1;tx++){
    if(tilesOk)g.drawImage(tileFor(tx,ty),tx*T+ox,ty*T+oy);
    else{g.fillStyle=(tx+ty)%2?"#386a3d":"#32623a";g.fillRect(tx*T+ox,ty*T+oy,T,T)}}
  if(!roadCv&&tilesOk&&ok(VART.dirt))buildRoad();if(roadCv)g.drawImage(roadCv,VX0+ox,VY0+oy);drawPud(ox,oy);
  const items=[];items.push({y:py,me:true});for(const t of trees)if(t.x+ox>-80&&t.x+ox<vw+80&&t.y+oy>-20&&t.y+oy<vh+200)items.push({y:t.y,tree:t});for(const b of bushes)if(b.x+ox>-90&&b.x+ox<vw+90&&b.y+oy>-20&&b.y+oy<vh+140)items.push({y:b.y,bush:b});for(const e of en)if(e.hp>0||e.dd>0)items.push({y:e.y,e});for(const b of BLD)items.push({y:b[0]==="well"?790:b[2],b:{k:b[0],x:b[1],y:b[2]}});for(const d of DECO)if(d.x+ox>-40&&d.x+ox<vw+40&&d.y+oy>-20&&d.y+oy<vh+80)items.push({y:d.y,b:d});for(const n of NPCS)items.push({y:n.y,npc:n});items.sort((a,b)=>a.y-b.y);
  for(const it of items){
    if(it.npc){drawNpc(it.npc,ox,oy)}else if(it.b){drawBld(it.b,ox,oy)}else if(it.tree){drawTree(it.tree,ox,oy)}else if(it.bush){drawBush(it.bush,ox,oy)}else if(it.e){drawEn(it.e,ox,oy)}else{
      if(window.dashDrawW&&dashDrawW(ox,oy))continue;
      const sx=px+ox,sy=py+oy,fr=face==="down"?(walk?10+Math.floor(walk)%6:10):face==="up"?(walk?16+Math.floor(walk)%6:16):(walk?4+Math.floor(walk)%6:Math.floor(idle)%4),s=0;
      g.fillStyle="#00000055";g.beginPath();g.ellipse(sx,sy,16,6,0,0,7);g.fill();
      g.save();g.translate(Math.round(sx),Math.round(sy+4-Math.abs(s)*4));g.rotate(s*.06);if(face==="left")g.scale(-1,1);const hb=atkT<=0?heldBucket():null;if(hb&&face==="up")drawHeld(hb);if(atkT>0&&atkImg){const f=Math.min(4,Math.floor((1-atkT/ATK)*5)),r=face==="down"?1:face==="up"?2:0;g.drawImage(atkImg,f*OW,r*OH,OW,OH,-OW/2,-OH+4,OW,OH)}else g.drawImage(sprite,fr*64,0,64,64,-SZ/2,-SZ,SZ,SZ);if(hb&&face!=="up")drawHeld(hb);g.restore();
      g.font="600 14px Kanit,sans-serif";g.textAlign="center";g.lineWidth=4;g.strokeStyle="#1c2130";
      g.strokeText(ch.name,sx,sy-SZ-2);g.fillStyle="#f3e8cf";g.fillText(ch.name,sx,sy-SZ-2)}}
  drawAcid(ox,oy);drawGod(ox,oy);drawFx(ox,oy);
  drawMap();
  if(joy.on){g.strokeStyle="#e3b04b99";g.lineWidth=3;g.beginPath();g.arc(joy.ox,joy.oy,50,0,7);g.stroke();
    const m=Math.min(Math.hypot(joy.x-joy.ox,joy.y-joy.oy),50),a=Math.atan2(joy.y-joy.oy,joy.x-joy.ox);
    g.fillStyle="#e3b04bcc";g.beginPath();g.arc(joy.ox+Math.cos(a)*m,joy.oy+Math.sin(a)*m,20,0,7);g.fill()}
}

function spawnE(e){const rd=Math.random()<.25;Object.assign(e,{ty:rd?"r":"g",hp:rd?45:30,max:rd?45:30,rs:0,dd:0,hurt:0,st:"",stT:0,cd:1+Math.random()*2,x:px+300,y:py});for(let k=0;k<20;k++){const x=T*2+Math.random()*(W-4)*T,y=T*2+Math.random()*(H-4)*T;if(Math.hypot(x-px,y-py)>260&&!blocked(x,y)&&!inVil(x,y)){e.x=x;e.y=y;return}}}

const say=(x,y,s,c,t=.9)=>fl.push({x,y:y-SZ,s,c,t});
function updateEn(dt){for(const e of en){
  if(e.hp<=0){e.dd=Math.max(0,(e.dd||0)-dt);e.rs-=dt;if(e.rs<=0)spawnE(e);continue}
  e.hurt=Math.max(0,(e.hurt||0)-dt);if(e.ty==="r")redAI(e,dt);if(e.st==="prep")continue;
  const d=Math.hypot(px-e.x,py-e.y)||1;
  if(d<240&&d>24){const vx=(px-e.x)/d*70*dt,vy=(py-e.y)/d*70*dt;if(!blocked(e.x+vx,e.y)&&!inVil(e.x+vx,e.y))e.x+=vx;if(!blocked(e.x,e.y+vy)&&!inVil(e.x,e.y+vy))e.y+=vy}
  if(d<28&&ch.inv<=0){const n=Math.max(2,10-(ch.def>>1));ch.hp-=n;ch.inv=1;say(px,py,"-"+n,"#ff7b6b");
    if(ch.hp<=0){die();ch.hp=ch.maxHp;px=960;py=980;say(px,py,"ฟื้นคืนชีพ","#f3e8cf",1.4)}updateStat()}}}
function resolveHit(){const fv={right:[1,0],left:[-1,0],down:[0,1],up:[0,-1]}[face];
  for(const e of en){if(e.hp<=0)continue;const dx=e.x-px,dy=e.y-py,d=Math.hypot(dx,dy)||1;
    if(d<85&&(d<20||(dx*fv[0]+dy*fv[1])/d>-.1)){const n=Math.round(ch.atk*atkMul()*(1.6+Math.random()*.4));e.hp-=n;e.hurt=.25;sfx("slash");say(e.x,e.y,n,"#ffe9a8");
      if(!blocked(e.x+dx/d*22,e.y))e.x+=dx/d*22;if(!blocked(e.x,e.y+dy/d*22))e.y+=dy/d*22;if(e.hp<=0)kill(e)}}
  let bt=null,bd=1e9;
  for(const t of trees){if(t.hp<=0)continue;const dx=t.x-px,dy=t.y-py,d=Math.hypot(dx,dy)||1;
    if(d<75&&(d<24||(dx*fv[0]+dy*fv[1])/d>-.1)&&d<bd){bt=t;bd=d}}
  if(bt)chop(bt,Math.round(ch.atk*atkMul()*(1.6+Math.random()*.4)));
  let bs=null;bd=1e9;
  for(const b of bushes){if(b.rs>0)continue;const dx=b.x-px,dy=b.y-py,d=Math.hypot(dx,dy)||1;
    if(d<75&&(d<24||(dx*fv[0]+dy*fv[1])/d>-.1)&&d<bd){bs=b;bd=d}}
  if(bs)pick(bs)}

    if(ch.level>=LV_CAP)ch.exp=0}

const SLIME_XP_R=6,ACID_PCT=.06,ACID_TICK=.5,ACID_LIFE=10,ACID_R=28,ACID_RANGE=[120,280],ACID_PREP=.6,ACID_CD=3,ACID_SPD=260,ACID_HIT=6,DEATH_T=.9;

const acid=[],pud=[],spl=[];let accTk=.15;
function hurtP(n,col){ch.hp-=n;say(px,py,"-"+n,col||"#ff7b6b");
  if(ch.hp<=0){die();ch.hp=ch.maxHp;px=960;py=980;pud.length=0;acid.length=0;say(px,py,"ฟื้นคืนชีพ","#f3e8cf",1.4)}updateStat()}
function redAI(e,dt){e.cd-=dt;const d=Math.hypot(px-e.x,py-e.y);
  if(e.st==="prep"){e.stT-=dt;if(e.stT<=0){e.st="";e.cd=ACID_CD;
      const a=Math.atan2(py-e.y,px-e.x),dist=Math.min(d,ACID_RANGE[1]+30);
      sfx("slimeAcid",e.x,e.y);acid.push({x:e.x,y:e.y,vx:Math.cos(a)*ACID_SPD,vy:Math.sin(a)*ACID_SPD,tx:e.x+Math.cos(a)*dist,ty:e.y+Math.sin(a)*dist,t:0})}
    return}
  if(e.cd<=0&&d>=ACID_RANGE[0]&&d<=ACID_RANGE[1]&&!inVil(px,py)){e.st="prep";e.stT=ACID_PREP}}
function acidLand(a,hitP){spl.push({x:a.x,y:a.y,t:0});if(!inVil(a.x,a.y))pud.push({x:a.x,y:a.y,age:0})}
function updateAcid(dt){
  for(let i=acid.length;i--;){const a=acid[i];a.t+=dt;a.x+=a.vx*dt;a.y+=a.vy*dt;
    const left=(a.tx-a.x)*a.vx+(a.ty-a.y)*a.vy;
    if(Math.hypot(a.x-px,a.y-py)<22){const n=Math.max(2,ACID_HIT-(ch.def>>1));hurtP(n,"#9fe08f");acidLand(a);acid.splice(i,1)}
    else if(left<=0||a.t>2||blocked(a.x,a.y)){acidLand(a);acid.splice(i,1)}}
  for(let i=spl.length;i--;){spl[i].t+=dt;if(spl[i].t>.45)spl.splice(i,1)}
  let inside=false;
  for(let i=pud.length;i--;){const p=pud[i];p.age+=dt;if(p.age>=ACID_LIFE){pud.splice(i,1);continue}
    if(Math.hypot(px-p.x,(py-p.y)*1.5)<ACID_R)inside=true}
  if(inside){accTk-=dt;if(accTk<=0){accTk=ACID_TICK;hurtP(Math.max(1,Math.ceil(ch.maxHp*ACID_PCT)),"#9fe08f")}}else accTk=.15}
function dF(im,f,cx,by,al){g.globalAlpha=al==null?1:al;g.drawImage(im,f[0],f[1],f[2],f[3],Math.round(cx-f[2]/2),Math.round(by-f[3]),f[2],f[3]);g.globalAlpha=1}
function drawPud(ox,oy){const im=VART.slime_acid;if(!ok(im))return;
  for(const p of pud){const x=p.x+ox,y=p.y+oy;if(x<-60||x>vw+60||y<-40||y>vh+40)continue;
    const f=SLM.acid.puddle[Math.floor(p.age*5)%4],fade=Math.min(1,(ACID_LIFE-p.age)/1.5),grow=Math.min(1,p.age/.25);
    g.globalAlpha=fade*(.55+.45*grow);g.drawImage(im,f[0],f[1],f[2],f[3],Math.round(x-f[2]/2),Math.round(y-f[3]/2+4),f[2],f[3]);g.globalAlpha=1}}
function drawAcid(ox,oy){const im=VART.slime_acid;if(!ok(im))return;
  for(const a of acid){const x=a.x+ox,y=a.y+oy,f=SLM.acid.proj[Math.floor(a.t*14)%3];
    g.fillStyle="#00000040";g.beginPath();g.ellipse(x,y+2,7,3,0,0,7);g.fill();
    g.save();g.translate(Math.round(x),Math.round(y-16));g.rotate(Math.atan2(a.vy,a.vx));g.drawImage(im,f[0],f[1],f[2],f[3],-f[2]/2,-f[3]/2,f[2],f[3]);g.restore()}
  for(const s of spl){const f=SLM.acid.splash[Math.min(3,Math.floor(s.t/.11))];dF(im,f,s.x+ox,s.y+oy+6,1-Math.max(0,s.t-.3)/.15)}}
function drawEn(e,ox,oy){const x=e.x+ox,y=e.y+oy,red=e.ty==="r",im=VART[red?"slime_red":"slime_green"],M=SLM[red?"red":"green"];
  if(!ok(im)){g.fillStyle=red?"#c0394b":"#5fbf6a";g.beginPath();g.ellipse(x,y-12,16,12,0,0,7);g.fill();return}
  const t=performance.now()/1000+e.ph;let an="idle",fi=Math.floor(t*5)%4,al=1;
  if(e.hp<=0){an="death";fi=Math.min(4,Math.floor((1-e.dd/DEATH_T)*5));al=Math.min(1,e.dd/.25)}
  else if(e.hurt>0){an="hit";fi=e.hurt>.125?0:1}
  else if(e.st==="prep"){an="prep";fi=Math.min(3,Math.floor((1-e.stT/ACID_PREP)*4))}
  const f=M[an][fi];dF(im,f,x,y+3,al);
  if(e.hp>0&&e.hp<e.max){g.fillStyle="#11151f";g.fillRect(x-16,y-f[3]-8,32,4);g.fillStyle=red?"#c0394b":"#d9534f";g.fillRect(x-16,y-f[3]-8,32*e.hp/e.max,4)}}

function drawFx(ox,oy){g.font="600 16px Kanit,sans-serif";g.textAlign="center";g.lineWidth=4;g.strokeStyle="#1c2130";

  for(const w of tv.waves){const a=Math.atan2(w.dy,w.dx);g.save();g.translate(w.x+ox,w.y+oy-20);g.rotate(a);g.globalAlpha=Math.max(0,1-w.t/.6);
    g.strokeStyle="#ff3b3b";g.lineWidth=14;g.beginPath();g.arc(-30,0,90,-1.05,1.05);g.stroke();g.strokeStyle="#ffe3e3";g.lineWidth=5;g.beginPath();g.arc(-30,0,90,-1,1);g.stroke();g.restore()}
  for(const f of tv.fx){const i=Math.min(3,Math.floor(f.t/f.d*4));spr("fx_"+f.k+i,f.x+ox,f.y+oy+(f.k==="dust"?2:0))}
  drawFx(ox,oy);
  if(joy.on){g.strokeStyle="#e3b04b99";g.lineWidth=3;g.beginPath();g.arc(joy.ox,joy.oy,50,0,7);g.stroke();
    const m=Math.min(Math.hypot(joy.x-joy.ox,joy.y-joy.oy),50),a=Math.atan2(joy.y-joy.oy,joy.x-joy.ox);g.fillStyle="#e3b04bcc";g.beginPath();g.arc(joy.ox+Math.cos(a)*m,joy.oy+Math.sin(a)*m,20,0,7);g.fill()}}
/* ---------- UPDATE: bar owner dialogue, sit-at-bar scene, cutscenes, free beer ---------- */
// วิดีโอคัตซีน: teak = แทงค์, sun = แอสซาซิน (เปลี่ยนลิงก์ได้ตรงนี้)

const css2=document.createElement("style");css2.textContent=`
#tvfade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .45s}

#tvcut button{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);padding:8px 14px;background:#000a;color:#fff;border:2px solid #fff8;border-radius:6px;font-size:15px}

const fadeEl=mk("div","tvfade"),cutEl=mk("div","tvcut",'<video playsinline webkit-playsinline preload="auto"></video><button type="button">ข้าม ▶▶</button><div class="hint"></div>');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const fade=async(on,ms=450)=>{fadeEl.style.transition="opacity "+ms+"ms";fadeEl.style.opacity=on?1:0;await wait(ms+40)};
let cutAbort=null;
function playCut(url){return new Promise(res=>{
  const v=cutEl.querySelector("video"),sk=cutEl.querySelector("button"),hint=cutEl.querySelector(".hint");
  let done=false,started=false,tmo=0;
  const end=()=>{if(done)return;done=true;clearTimeout(tmo);cutAbort=null;try{v.pause();v.removeAttribute("src");v.load()}catch(e){}cutEl.style.display="none";res()};
  cutAbort=end;cutEl.style.display="flex";hint.textContent="กำลังโหลดคัตซีน...";
  if(!url){hint.textContent="ไม่มีคัตซีน ข้ามไป...";setTimeout(end,700);return}
  v.muted=false;v.src=url;
  v.onplaying=()=>{started=true;clearTimeout(tmo);hint.textContent=v.muted?"แตะหน้าจอเพื่อเปิดเสียง":""};
  v.onended=end;
  v.onerror=()=>{hint.textContent="เล่นคัตซีนไม่ได้ ข้ามไป...";setTimeout(end,900)};
  sk.onclick=end;
  v.onclick=()=>{if(v.muted){v.muted=false;hint.textContent=""}if(v.paused)v.play().catch(()=>{})};
  tmo=setTimeout(()=>{if(!started){hint.textContent="โหลดคัตซีนนานเกินไป ข้ามไป...";setTimeout(end,900)}},20000);
  const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{v.muted=true;v.play().catch(()=>{})})})}
const cutUrl=k=>(CUTS[ch.origin]||CUTS.teak)[k];
/* คุยกับเจ้าของร้าน */
const nearOwner=()=>Math.hypot(px-OWNER_POS.x,py-OWNER_POS.y)<95;
const canTalkOwner=()=>running&&inTv&&tv&&!dl&&!paused&&!tv.cut&&nearOwner()&&(tv.phase===0||(tv.phase===4&&tv.cutDone));
function tvTalkBtn(){if(!canTalkOwner())return;const b=$("talk");b.style.display="block";b.textContent="💬 คุยกับเจ้าของร้าน (E)"}
function tvTalk(){if(!canTalkOwner())return;
  if(tv.phase===0)dlgOpen(["เฮ้! ลูกค้าหน้าใหม่นี่นา ยินดีต้อนรับสู่ร้านเหล้าสุดท้ายของเมืองนี้","ช่วงนี้ในเมืองไม่ค่อยสงบเลยนะ พวกโจรชอบมาป่วนแถวนี้ ข้าเองก็ได้แต่ภาวนาให้พวกมันอย่าโผล่มา","ว่าแต่... จะดื่มอะไรดีล่ะ? เบียร์เย็นๆ สักแก้วไหม?"],[{t:"ตกลง",fn:seqEnter}],OWNER);
  else tvThanks()}
function tvThanks(){
  if(tv.thanked)return dlgOpen(["ดื่มให้หนำใจเลยนะ! ประตูไม้ที่พังอยู่ทางโน้น ไว้ข้าซ่อมเสร็จเมื่อไหร่ค่อยแวะมาอีกนะ"],[],OWNER);
  if(!qs.tvBeer)return dlgOpen(["โอ้โห... ขอบคุณมากเลยนะ! ถ้าไม่ได้เอ็งช่วยไว้ ร้านข้าคงพังยับเยินไปแล้ว","พวกโจรนั่นก่อกวนแถวนี้มาหลายเดือน วันนี้ข้าถึงนอนหลับสบายได้เสียที","รับนี่ไปสิ เบียร์แก้วนี้ข้าเลี้ยงเอง ฟรี! ถือว่าเป็นของขอบคุณ"],[{t:"รับเบียร์",fn:giveBeer}],OWNER);
  dlgOpen(["เอ็งช่วยข้าไว้อีกแล้วนะ! ขอบใจจริงๆ","วันหลังแวะมาดื่มได้เสมอ ข้ายินดีต้อนรับ"],[{t:"ปิด",ghost:1,fn:()=>{tv.thanked=true;msg("เดินออกทางประตูไม้ที่พังเพื่อกลับ",3000)}}],OWNER)}
function giveBeer(){qs.beer=(qs.beer||0)+1;qs.tvBeer=true;tv.thanked=true;saveQ();
  showDrop(TVA.beer.s,"ได้รับ เบียร์ ×1");say(px,py-40,"+1 เบียร์","#ffd24a",1.6);msg("ใส่เบียร์ลงกระเป๋าแล้ว — เดินออกทางประตูไม้ที่พังเพื่อกลับ",3600)}
addEventListener("keydown",e=>{if(e.key.toLowerCase()==="e"&&canTalkOwner()){e.preventDefault();tvTalk()}});
/* ลำดับเหตุการณ์ */
async function seqEnter(){const S=tv;if(!S||S.cut)return;S.cut=true;
  await fade(true);if(tv!==S)return;
  S.sit=true;await fade(false);if(tv!==S)return;
  msgEl.style.top="14%";msg("เจ้าของร้าน: เบียร์เย็นๆ มาแล้ว! ดื่มให้หายเหนื่อยก่อนนะ",3200);
  await wait(3500);if(tv!==S)return;
  await fade(true);if(tv!==S)return;
  msgEl.style.opacity=0;msgEl.style.top="";paused=true;bgmStop();
  await playCut(cutUrl("enter"));if(tv!==S)return;
  paused=false;last=performance.now();S.sit=false;
  await fade(false);if(tv!==S)return;
  S.cut=false;startFight()}
async function seqWin(){const S=tv;S.cut=true;
  msg("LAST BATTLE TOWN 1 — CLEAR!",2400);
  await wait(2600);if(tv!==S)return;

window.dashDrawW=function(ox,oy){if(inTv||!ch||ch.origin!=="sun"||!(dashT>0))return false;
